<!DOCTYPE html>
<html>

  <title>PathFinder AI — Your Skilled Migration Pathway, Mapped</title>

  <meta property="og:site_name" content="PathFinder AI">
  <meta property="og:title" content="PathFinder AI — Your Skilled Migration Pathway, Mapped">
  <meta property="og:description" content="Organize your documents against your target occupation and country, see the specific gaps between what you have and what's required, and follow a day-by-day plan to close them.">
