name: Test, build, and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # pubspec.yaml declares .env as an asset (gitignored, so it never
      # exists on a fresh checkout) -- flutter analyze fails on a missing
      # declared asset even though nothing here actually needs real
      # values. Same SUPABASE_ANON_KEY note as the deploy job below.
      - name: Write .env for analyze/test
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - run: flutter analyze
      - run: flutter test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # SUPABASE_ANON_KEY is a publishable client key by Supabase's own
      # design (protected by Row-Level Security, not secrecy) — safe to
      # bake into the client bundle. Nothing server-only (service role,
      # OpenAI, email provider keys) is ever referenced here.
      - name: Write .env for the client build
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
      - run: flutter build web --release --base-href /pathfinder-ai/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
